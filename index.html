<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageResizer Pro（本地證件相批量處理）</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/jszip.min.js"></script>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <nav>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">

                </svg>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">ImageResizer Pro</h1>
                <span class="hidden sm:inline text-xs text-gray-400 ml-2">入台證／護照／回鄉證／國際車牌</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="batch-progress-text" class="text-xs text-gray-500 hidden"></span>
                <button id="btn-batch-download" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow-sm flex items-center gap-2">

                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />

                    批次下載 ZIP

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center bg-white cursor-pointer hover:border-blue-500 hover:bg-gray-50 transition-all duration-200 ease-in-out group">
            <input type="file" id="file-input" multiple accept="image/*" class="hidden">
            <div class="flex flex-col items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400 group-hover:text-blue-500 mb-4 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h3 class="text-lg font-semibold text-gray-700">點擊或拖曳圖片到此處上傳</h3>
                <p class="text-sm text-gray-500 mt-2">支援 JPG, PNG, WebP（所有處理皆在本地端完成，不上傳伺服器）</p>
                <p class="kbd-hint">快捷鍵：選中預覽後 ←→↑↓ 微調 · +/− 縮放 · F 適合 · R 重置</p>
            </div>
        </div>

        <div id="image-gallery" class="mt-8 grid grid-cols-1 gap-8 empty:hidden">
            <!-- 圖片卡片會動態注入到這裡 -->
        </div>

    </main>

    <script>
        /**
         * ImageResizer Pro — 本地證件相批量處理（修正版）
         * 修正：預設入台證、單位同步、EXIF 方向、批次進度、鍵盤快捷鍵、自訂色事件
         */
        const imagesData = new Map();
        let idCounter = 0;
        let activeStageId = null; // for keyboard focus
        const DPI = 300;
        const DEFAULT_PRESET_INDEX = 1; // 入台證 (35×45 mm)

        const PRESETS = [
            { label: '自訂尺寸', width: null, height: null, unit: 'px' },
            { label: '入台證 (35×45 mm)', width: 35, height: 45, unit: 'mm' },
            { label: '香港特區護照 (40×50 mm)', width: 40, height: 50, unit: 'mm' },
            { label: '國際駕駛許可證 (40×50 mm)', width: 40, height: 50, unit: 'mm' },
            { label: '回鄉證 (33×48 mm)', width: 33, height: 48, unit: 'mm' },
            { label: '證件照 2吋 (35×45 mm)', width: 35, height: 45, unit: 'mm' },
            { label: '2R 照片 (89×127 mm)', width: 89, height: 127, unit: 'mm' },
            { label: '3R 照片 (127×178 mm)', width: 127, height: 178, unit: 'mm' },
            { label: 'YouTube 縮圖 (1280×720)', width: 1280, height: 720, unit: 'px' },
            { label: 'IG 貼文 方形 (1080×1080)', width: 1080, height: 1080, unit: 'px' },
            { label: 'IG 貼文 直向 (1080×1350)', width: 1080, height: 1350, unit: 'px' },
            { label: 'IG Story 限動 (1080×1920)', width: 1080, height: 1920, unit: 'px' },
            { label: 'PWA Icon (192×192)', width: 192, height: 192, unit: 'px' },
            { label: 'PWA Icon (512×512)', width: 512, height: 512, unit: 'px' },
            { label: '回鄉證數碼 (354×472 px)', width: 354, height: 472, unit: 'px' },
            { label: '護照數碼最低 (1200×1600 px)', width: 1200, height: 1600, unit: 'px' }
        ];

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('image-gallery');
        const btnBatchDownload = document.getElementById('btn-batch-download');
        const batchProgressText = document.getElementById('batch-progress-text');
        const batchProgressBar = document.getElementById('batch-progress-bar');
        const batchProgressFill = document.getElementById('batch-progress-fill');

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        function mmToPx(mm) {
            return Math.round((mm * DPI) / 25.4);
        }
        function pxToMm(px) {
            return Number(((px * 25.4) / DPI).toFixed(2));
        }

        function getTargetPx(settings) {
            let w = settings.width;
            let h = settings.height;
            if (settings.unit === 'mm') {
                w = mmToPx(w);
                h = mmToPx(h);
            }
            return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
        }

        // —— EXIF Orientation ——
        // Minimal parser: read orientation tag from JPEG APP1
        function getExifOrientation(arrayBuffer) {
            try {
                const view = new DataView(arrayBuffer);
                if (view.getUint16(0, false) !== 0xFFD8) return 1; // not JPEG
                let offset = 2;
                const length = view.byteLength;
                while (offset < length) {
                    if (view.getUint16(offset, false) === 0xFFE1) {
                        const exifStart = offset + 4;
                        if (view.getUint32(exifStart, false) !== 0x45786966) return 1; // "Exif"
                        const little = view.getUint16(exifStart + 6, false) === 0x4949;
                        const tiffOffset = exifStart + 6;
                        const firstIFD = view.getUint32(tiffOffset + 4, little);
                        let dirOffset = tiffOffset + firstIFD;
                        const entries = view.getUint16(dirOffset, little);
                        dirOffset += 2;
                        for (let i = 0; i < entries; i++) {
                            const entry = dirOffset + i * 12;
                            if (view.getUint16(entry, little) === 0x0112) { // Orientation
                                return view.getUint16(entry + 8, little);
                            }
                        }
                        return 1;
                    }
                    offset += 2;
                    if (offset >= length) break;
                    const size = view.getUint16(offset, false);
                    offset += size;
                }
            } catch (_) {}
            return 1;
        }

        function applyOrientation(img, orientation) {
            if (!orientation || orientation === 1) return img;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;
            // 5-8 swap dimensions
            if (orientation >= 5) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }
            switch (orientation) {
                case 2: ctx.transform(-1, 0, 0, 1, w, 0); break;
                case 3: ctx.transform(-1, 0, 0, -1, w, h); break;
                case 4: ctx.transform(1, 0, 0, -1, 0, h); break;
                case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
                case 6: ctx.transform(0, 1, -1, 0, h, 0); break;
                case 7: ctx.transform(0, -1, -1, 0, h, w); break;
                case 8: ctx.transform(0, -1, 1, 0, 0, w); break;
                default: return img;
            }
            ctx.drawImage(img, 0, 0);
            const out = new Image();
            out.src = canvas.toDataURL('image/png');
            // Return a promise-like via onload handled by caller — sync fallback: use canvas as source via Image
            // We'll load it asynchronously in processFiles
            return out;
        }

        function loadImageWithOrientation(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    const arrBufReader = new FileReader();
                    arrBufReader.onload = (ev) => {
                        const orientation = getExifOrientation(ev.target.result);
                        const img = new Image();
                        img.onload = () => {
                            if (orientation === 1) {
                                resolve(img);
                                return;
                            }
                            const fixed = applyOrientation(img, orientation);
                            if (fixed.complete && fixed.naturalWidth) {
                                resolve(fixed);
                            } else {
                                fixed.onload = () => resolve(fixed);
                                fixed.onerror = reject;
                            }
                        };
                        img.onerror = reject;
                        img.src = dataUrl;
                    };
                    arrBufReader.onerror = () => {
                        // fallback without EXIF
                        const img = new Image();
                        img.onload = () => resolve(img);
                        img.onerror = reject;
                        img.src = dataUrl;
                    };
                    arrBufReader.readAsArrayBuffer(file);
                };
                reader.readAsDataURL(file);
            });
        }

        // Dropzone
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dropzone-active');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dropzone-active'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dropzone-active');
            if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) processFiles(e.target.files);
            fileInput.value = '';
        });

        async function processFiles(files) {
            const list = Array.from(files).filter(f => f.type.startsWith('image/'));
            for (const file of list) {
                try {
                    const img = await loadImageWithOrientation(file);
                    // ensure naturalWidth available
                    await new Promise((res) => {
                        if (img.complete && img.naturalWidth) res();
                        else img.onload = () => res();
                    });
                    const id = `img_${idCounter++}`;
                    const preset = PRESETS[DEFAULT_PRESET_INDEX];
                    imagesData.set(id, {
                        id,
                        file,
                        originalName: file.name.replace(/\.[^/.]+$/, ''),
                        originalImg: img,
                        settings: {
                            width: preset.width,
                            height: preset.height,
                            unit: preset.unit,
                            bgColor: 'transparent',
                            customBgColor: '#ff0000',
                            scale: 1,
                            offsetX: 0,
                            offsetY: 0,
                            cropEnabled: true,
                            zoomStepPercent: 10  // 每次 +/- 縮放百分比，可自訂
                        }
                    });
                    renderImageCard(id);
                    updateBatchDownloadButton();
                    requestAnimationFrame(() => {
                        fitImageToCrop(id);
                        drawStage(id);
                        updateExportCanvas(id);
                    });
                } catch (err) {
                    console.error('載入圖片失敗:', file.name, err);
                    alert(`無法載入圖片：${file.name}`);
                }
            }
        }

        function renderImageCard(id) {
            const data = imagesData.get(id);
            const { settings, originalImg } = data;
            const card = document.createElement('div');
            card.id = `card-${id}`;
            card.className = 'bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col lg:flex-row transition-all';
            card.tabIndex = 0; // focusable for keyboard

            const presetsHTML = PRESETS.map((p, index) =>
                `<option value="${index}" ${index === DEFAULT_PRESET_INDEX ? 'selected' : ''}>${p.label}</option>`
            ).join('');

            card.innerHTML = `
                <!-- 左側：可縮放 / 拖曳 / 裁剪預覽 -->
                <div class="lg:w-5/12 p-4 bg-gray-100 border-b lg:border-b-0 lg:border-r border-gray-100 flex flex-col">
                    <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                        <span class="text-xs font-medium text-gray-600">預覽 · 滾輪縮放 · 拖曳移動</span>
                        <div class="flex items-center gap-1 flex-wrap">
                            <label class="text-xs text-gray-500 flex items-center gap-1" title="每次按 +/- 的縮放幅度">
                                步進
                                <input type="number" id="zoom-step-${id}" value="${settings.zoomStepPercent}" min="1" max="100" step="1"
                                       class="w-12 border border-gray-300 rounded px-1 py-0.5 text-xs text-center outline-none focus:ring-2 focus:ring-blue-500"
                                       title="每次 +/- 縮放百分比（1–100）">
                                <span class="text-gray-400">%</span>
                            </label>
                            <button type="button" data-zoom="out" class="px-2 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-50" title="縮小 (−)">−</button>
                            <button type="button" data-zoom="in" class="px-2 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-50" title="放大 (+)">+</button>
                            <button type="button" data-fit class="px-2 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-50" title="適合 (F)">適合</button>
                            <button type="button" data-reset class="px-2 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-50" title="重置 (R)">重置</button>
                        </div>
                    </div>
                    <div id="stage-${id}" class="relative w-full bg-checker rounded-xl overflow-hidden border border-gray-200 select-none touch-none"
                         style="height: 320px; cursor: grab;" tabindex="-1">
                        <canvas id="view-${id}" class="absolute inset-0 w-full h-full"></canvas>
                        <div id="crop-frame-${id}" class="absolute border-2 border-blue-500 pointer-events-none shadow-[0_0_0_9999px_rgba(0,0,0,0.35)]"
                             style="box-sizing: border-box;"></div>
                        <div class="absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm" id="info-${id}">載入中...</div>
                    </div>
                    <p class="text-xs text-gray-400 mt-2 text-center">裁剪框比例 = 目標輸出尺寸；拖曳圖片調整構圖</p>
                </div>

                <!-- 右側控制 -->
                <div class="lg:w-7/12 p-6 flex flex-col gap-5">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800 text-lg line-clamp-1" title="${data.file.name}">${data.file.name}</h4>
                            <p class="text-xs text-gray-500">原始尺寸: ${originalImg.naturalWidth || originalImg.width} × ${originalImg.naturalHeight || originalImg.height} px</p>
                        </div>
                        <button type="button" data-remove class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="移除">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">常用比例 / 尺寸預設</label>
                            <select id="preset-${id}" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-gray-50">
                                ${presetsHTML}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">目標寬度</label>
                            <div class="flex">
                                <input type="number" id="width-${id}" value="${settings.width}" min="1" max="10000" step="any" class="w-full border border-gray-300 rounded-l-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <select id="unit-w-${id}" class="bg-gray-100 border border-l-0 border-gray-300 rounded-r-lg px-2 text-sm text-gray-600 outline-none">
                                    <option value="px" ${settings.unit === 'px' ? 'selected' : ''}>px</option>
                                    <option value="mm" ${settings.unit === 'mm' ? 'selected' : ''}>mm</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">目標高度</label>
                            <div class="flex">
                                <input type="number" id="height-${id}" value="${settings.height}" min="1" max="10000" step="any" class="w-full border border-gray-300 rounded-l-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <select id="unit-h-${id}" class="bg-gray-100 border border-l-0 border-gray-300 rounded-r-lg px-2 text-sm text-gray-600 outline-none">
                                    <option value="px" ${settings.unit === 'px' ? 'selected' : ''}>px</option>
                                    <option value="mm" ${settings.unit === 'mm' ? 'selected' : ''}>mm</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">背景填充色（裁剪後空白處）</label>
                        <div class="flex items-center gap-3">
                            <button type="button" class="bg-btn-${id} w-8 h-8 rounded-full border-2 border-blue-500 shadow-sm bg-checker relative" data-color="transparent" title="透明"></button>
                            <button type="button" class="bg-btn-${id} w-8 h-8 rounded-full border-2 border-gray-200 shadow-sm bg-white" data-color="#ffffff" title="白"></button>
                            <button type="button" class="bg-btn-${id} w-8 h-8 rounded-full border-2 border-gray-200 shadow-sm bg-black" data-color="#000000" title="黑"></button>
                            <div class="relative flex items-center">
                                <input type="color" id="custom-color-${id}" value="#ff0000" class="w-8 h-8 rounded cursor-pointer border-0 p-0 opacity-0 absolute z-10" title="自訂">
                                <button type="button" class="bg-btn-${id} w-8 h-8 rounded-full border-2 border-gray-200 shadow-sm bg-red-500 relative z-0 flex items-center justify-center" id="custom-color-btn-${id}" data-color="custom" title="自訂色">
                                   <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white drop-shadow" viewBox="0 0 20 20" fill="currentColor">
                                      <path fill-rule="evenodd" d="M4 2a2 2 0 00-2 2v11a3 3 0 106 0V4a2 2 0 00-2-2H4zm1 14a1 1 0 100-2 1 1 0 000 2zm5-1.757l4.9-4.9a2 2 0 000-2.828L13.485 5.1a2 2 0 00-2.828 0L10 5.757v8.486zM16 18H9.071l6-6H16a2 2 0 012 2v2a2 2 0 01-2 2z" clip-rule="evenodd" />
                                   </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-auto pt-4 border-t border-gray-100 space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">匯出格式</label>
                            <div class="flex gap-2">
                                <select id="format-${id}" class="flex-1 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                                    <option value="png" selected>PNG（支援透明背景）</option>
                                    <option value="jpeg">JPG / JPEG</option>
                                </select>
                                <input type="number" id="quality-${id}" value="92" min="50" max="100" step="1" title="JPG 品質 %" class="w-20 border border-gray-300 rounded-lg p-2.5 text-sm text-center" disabled>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">JPG 時可調品質；透明背景請用 PNG</p>
                        </div>
                        <button type="button" data-download class="w-full bg-gray-900 hover:bg-gray-800 text-white py-2.5 rounded-lg font-medium transition-colors flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            下載此圖片
                        </button>
                    </div>
                </div>
            `;

            gallery.appendChild(card);
            bindCardEvents(id);
            layoutCropFrame(id);
            drawStage(id);
        }

        function setBgButtonActive(id, color) {
            const bgBtns = document.querySelectorAll(`.bg-btn-${id}`);
            bgBtns.forEach(b => {
                b.classList.remove('border-blue-500');
                b.classList.add('border-gray-200');
                if (b.dataset.color === color || (color === 'custom' && b.dataset.color === 'custom')) {
                    b.classList.remove('border-gray-200');
                    b.classList.add('border-blue-500');
                }
            });
        }

        function bindCardEvents(id) {
            const data = imagesData.get(id);
            const settings = data.settings;
            const card = document.getElementById(`card-${id}`);
            const stage = document.getElementById(`stage-${id}`);
            const widthInput = document.getElementById(`width-${id}`);
            const heightInput = document.getElementById(`height-${id}`);
            const unitWSelect = document.getElementById(`unit-w-${id}`);
            const unitHSelect = document.getElementById(`unit-h-${id}`);
            const presetSelect = document.getElementById(`preset-${id}`);
            const bgBtns = document.querySelectorAll(`.bg-btn-${id}`);
            const customColorInput = document.getElementById(`custom-color-${id}`);
            const customColorBtn = document.getElementById(`custom-color-btn-${id}`);
            const formatSelect = document.getElementById(`format-${id}`);
            const qualityInput = document.getElementById(`quality-${id}`);

            const triggerDim = debounce(() => {
                layoutCropFrame(id);
                drawStage(id);
                updateExportCanvas(id);
            }, 120);

            widthInput.addEventListener('input', () => {
                settings.width = parseFloat(widthInput.value) || 1;
                presetSelect.value = '0';
                triggerDim();
            });
            heightInput.addEventListener('input', () => {
                settings.height = parseFloat(heightInput.value) || 1;
                presetSelect.value = '0';
                triggerDim();
            });

            // 單位雙向同步
            function changeUnit(newUnit, fromSelect) {
                if (newUnit === settings.unit) return;
                if (newUnit === 'mm' && settings.unit === 'px') {
                    settings.width = pxToMm(settings.width);
                    settings.height = pxToMm(settings.height);
                } else if (newUnit === 'px' && settings.unit === 'mm') {
                    settings.width = mmToPx(settings.width);
                    settings.height = mmToPx(settings.height);
                }
                settings.unit = newUnit;
                unitWSelect.value = newUnit;
                unitHSelect.value = newUnit;
                widthInput.value = settings.width;
                heightInput.value = settings.height;
                presetSelect.value = '0';
                layoutCropFrame(id);
                drawStage(id);
                updateExportCanvas(id);
            }
            unitWSelect.addEventListener('change', (e) => changeUnit(e.target.value));
            unitHSelect.addEventListener('change', (e) => changeUnit(e.target.value));

            presetSelect.addEventListener('change', (e) => {
                const idx = parseInt(e.target.value, 10);
                if (idx === 0) return;
                const preset = PRESETS[idx];
                settings.unit = preset.unit;
                settings.width = preset.width;
                settings.height = preset.height;
                unitWSelect.value = preset.unit;
                unitHSelect.value = preset.unit;
                widthInput.value = preset.width;
                heightInput.value = preset.height;
                fitImageToCrop(id);
                layoutCropFrame(id);
                drawStage(id);
                updateExportCanvas(id);
            });

            bgBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const t = e.currentTarget;
                    const color = t.dataset.color;
                    settings.bgColor = color;
                    setBgButtonActive(id, color);
                    updateExportCanvas(id);
                });
            });

            // 自訂色：只改顏色與選中狀態，不模擬 click 避免重複
            customColorInput.addEventListener('input', (e) => {
                settings.customBgColor = e.target.value;
                customColorBtn.style.backgroundColor = e.target.value;
                settings.bgColor = 'custom';
                setBgButtonActive(id, 'custom');
                updateExportCanvas(id);
            });
            customColorBtn.addEventListener('click', (e) => {
                // 若已是 custom，點按鈕再開 color picker；否則只選中
                if (settings.bgColor !== 'custom') {
                    settings.bgColor = 'custom';
                    setBgButtonActive(id, 'custom');
                    updateExportCanvas(id);
                }
            });

            formatSelect.addEventListener('change', () => {
                const isJpeg = formatSelect.value === 'jpeg';
                qualityInput.disabled = !isJpeg;
                if (isJpeg && settings.bgColor === 'transparent') {
                    settings.bgColor = '#ffffff';
                    setBgButtonActive(id, '#ffffff');
                    updateExportCanvas(id);
                }
            });

            card.querySelector('[data-remove]')?.addEventListener('click', () => removeImage(id));
            card.querySelector('[data-download]')?.addEventListener('click', () => downloadSingle(id));

            cardZoomButtons(id);

            // Focus tracking for keyboard
            stage.addEventListener('pointerdown', () => { activeStageId = id; card.focus({ preventScroll: true }); });
            card.addEventListener('focus', () => { activeStageId = id; });

            // Pointer interactions: pan + wheel zoom
            let dragging = false;
            let lastX = 0, lastY = 0;

            stage.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                dragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                stage.setPointerCapture(e.pointerId);
                stage.style.cursor = 'grabbing';
            });
            stage.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                settings.offsetX += dx;
                settings.offsetY += dy;
                drawStage(id);
                updateExportCanvas(id);
            });
            const endDrag = (e) => {
                if (!dragging) return;
                dragging = false;
                stage.style.cursor = 'grab';
                try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
            };
            stage.addEventListener('pointerup', endDrag);
            stage.addEventListener('pointercancel', endDrag);

            stage.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = stage.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
                zoomAt(id, mx, my, factor);
            }, { passive: false });
        }

        /** 取得使用者設定的縮放步進 factor（例如 10% → 1.10） */
        function getZoomStepFactor(id) {
            const data = imagesData.get(id);
            let pct = data?.settings?.zoomStepPercent ?? 10;
            const input = document.getElementById(`zoom-step-${id}`);
            if (input) {
                const v = parseFloat(input.value);
                if (!isNaN(v) && v > 0) pct = v;
            }
            pct = Math.min(100, Math.max(1, pct));
            if (data) data.settings.zoomStepPercent = pct;
            return 1 + pct / 100;
        }

        function cardZoomButtons(id) {
            const card = document.getElementById(`card-${id}`);
            const stage = document.getElementById(`stage-${id}`);
            const zoomStepInput = document.getElementById(`zoom-step-${id}`);

            zoomStepInput?.addEventListener('change', () => {
                let v = parseFloat(zoomStepInput.value);
                if (isNaN(v) || v < 1) v = 1;
                if (v > 100) v = 100;
                zoomStepInput.value = v;
                const data = imagesData.get(id);
                if (data) data.settings.zoomStepPercent = v;
            });
            zoomStepInput?.addEventListener('input', () => {
                const v = parseFloat(zoomStepInput.value);
                if (!isNaN(v) && v >= 1 && v <= 100) {
                    const data = imagesData.get(id);
                    if (data) data.settings.zoomStepPercent = v;
                }
            });

            card.querySelector('[data-zoom="in"]')?.addEventListener('click', () => {
                const r = stage.getBoundingClientRect();
                const factor = getZoomStepFactor(id);
                zoomAt(id, r.width / 2, r.height / 2, factor);
            });
            card.querySelector('[data-zoom="out"]')?.addEventListener('click', () => {
                const r = stage.getBoundingClientRect();
                const factor = getZoomStepFactor(id);
                zoomAt(id, r.width / 2, r.height / 2, 1 / factor);
            });
            card.querySelector('[data-fit]')?.addEventListener('click', () => {
                fitImageToCrop(id);
                drawStage(id);
                updateExportCanvas(id);
            });
            card.querySelector('[data-reset]')?.addEventListener('click', () => {
                const data = imagesData.get(id);
                data.settings.scale = 1;
                data.settings.offsetX = 0;
                data.settings.offsetY = 0;
                fitImageToCrop(id);
                drawStage(id);
                updateExportCanvas(id);
            });
        }

        // Keyboard shortcuts (when a card/stage is active)
        document.addEventListener('keydown', (e) => {
            if (!activeStageId || !imagesData.has(activeStageId)) return;
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

            const id = activeStageId;
            const data = imagesData.get(id);
            const stage = document.getElementById(`stage-${id}`);
            if (!stage) return;
            const r = stage.getBoundingClientRect();
            const step = e.shiftKey ? 10 : 2;
            const zoomFactor = getZoomStepFactor(id);

            switch (e.key) {
                case '+':
                case '=':
                    e.preventDefault();
                    zoomAt(id, r.width / 2, r.height / 2, zoomFactor);
                    break;
                case '-':
                case '_':
                    e.preventDefault();
                    zoomAt(id, r.width / 2, r.height / 2, 1 / zoomFactor);
                    break;
                case 'f':
                case 'F':
                    e.preventDefault();
                    fitImageToCrop(id);
                    drawStage(id);
                    updateExportCanvas(id);
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    data.settings.scale = 1;
                    data.settings.offsetX = 0;
                    data.settings.offsetY = 0;
                    fitImageToCrop(id);
                    drawStage(id);
                    updateExportCanvas(id);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    data.settings.offsetX -= step;
                    drawStage(id);
                    updateExportCanvas(id);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    data.settings.offsetX += step;
                    drawStage(id);
                    updateExportCanvas(id);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    data.settings.offsetY -= step;
                    drawStage(id);
                    updateExportCanvas(id);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    data.settings.offsetY += step;
                    drawStage(id);
                    updateExportCanvas(id);
                    break;
            }
        });

        function zoomAt(id, mx, my, factor) {
            const data = imagesData.get(id);
            if (!data) return;
            const s = data.settings;
            const oldScale = s.scale;
            const newScale = Math.min(8, Math.max(0.1, oldScale * factor));
            s.offsetX = mx - (mx - s.offsetX) * (newScale / oldScale);
            s.offsetY = my - (my - s.offsetY) * (newScale / oldScale);
            s.scale = newScale;
            drawStage(id);
            updateExportCanvas(id);
        }

        function getCropFrameRect(id) {
            const stage = document.getElementById(`stage-${id}`);
            const data = imagesData.get(id);
            if (!stage || !data) return { x: 0, y: 0, w: 100, h: 100 };
            const sw = stage.clientWidth;
            const sh = stage.clientHeight;
            const { w: tw, h: th } = getTargetPx(data.settings);
            const pad = 24;
            const maxW = sw - pad * 2;
            const maxH = sh - pad * 2;
            const scale = Math.min(maxW / tw, maxH / th, 1e6);
            const fw = tw * scale;
            const fh = th * scale;
            return {
                x: (sw - fw) / 2,
                y: (sh - fh) / 2,
                w: fw,
                h: fh,
                screenPerOut: scale
            };
        }

        function layoutCropFrame(id) {
            const frame = document.getElementById(`crop-frame-${id}`);
            if (!frame) return;
            const r = getCropFrameRect(id);
            frame.style.left = r.x + 'px';
            frame.style.top = r.y + 'px';
            frame.style.width = r.w + 'px';
            frame.style.height = r.h + 'px';
        }

        function fitImageToCrop(id) {
            const data = imagesData.get(id);
            if (!data) return;
            const img = data.originalImg;
            const stage = document.getElementById(`stage-${id}`);
            if (!stage) return;
            layoutCropFrame(id);
            const r = getCropFrameRect(id);
            const nw = img.naturalWidth || img.width;
            const nh = img.naturalHeight || img.height;
            const cover = Math.max(r.w / nw, r.h / nh);
            data.settings.scale = cover;
            const dispW = nw * cover;
            const dispH = nh * cover;
            data.settings.offsetX = r.x + (r.w - dispW) / 2;
            data.settings.offsetY = r.y + (r.h - dispH) / 2;
        }

        function drawStage(id) {
            const data = imagesData.get(id);
            if (!data) return;
            const canvas = document.getElementById(`view-${id}`);
            const stage = document.getElementById(`stage-${id}`);
            if (!canvas || !stage) return;

            const dpr = window.devicePixelRatio || 1;
            const sw = stage.clientWidth;
            const sh = stage.clientHeight;
            canvas.width = Math.round(sw * dpr);
            canvas.height = Math.round(sh * dpr);
            canvas.style.width = sw + 'px';
            canvas.style.height = sh + 'px';

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, sw, sh);

            const img = data.originalImg;
            const s = data.settings;
            const nw = img.naturalWidth || img.width;
            const nh = img.naturalHeight || img.height;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(
                img,
                s.offsetX,
                s.offsetY,
                nw * s.scale,
                nh * s.scale
            );

            layoutCropFrame(id);

            const { w: tw, h: th } = getTargetPx(s);
            const info = document.getElementById(`info-${id}`);
            if (info) {
                info.textContent = `輸出 ${tw}×${th} px · 縮放 ${(s.scale * 100).toFixed(0)}%`;
            }
        }

        function updateExportCanvas(id) {
            const data = imagesData.get(id);
            if (!data) return;
            const s = data.settings;
            const img = data.originalImg;
            const { w: tw, h: th } = getTargetPx(s);
            const frame = getCropFrameRect(id);

            const srcX = (frame.x - s.offsetX) / s.scale;
            const srcY = (frame.y - s.offsetY) / s.scale;
            const srcW = frame.w / s.scale;
            const srcH = frame.h / s.scale;

            const canvas = document.createElement('canvas');
            canvas.width = tw;
            canvas.height = th;
            const ctx = canvas.getContext('2d');

            if (s.bgColor !== 'transparent') {
                ctx.fillStyle = s.bgColor === 'custom' ? s.customBgColor : s.bgColor;
                ctx.fillRect(0, 0, tw, th);
            }

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(
                img,
                srcX, srcY, srcW, srcH,
                0, 0, tw, th
            );

            data.currentCanvas = canvas;
        }

        function removeImage(id) {
            if (activeStageId === id) activeStageId = null;
            imagesData.delete(id);
            document.getElementById(`card-${id}`)?.remove();
            updateBatchDownloadButton();
        }

        function updateBatchDownloadButton() {
            if (imagesData.size > 1) btnBatchDownload.classList.remove('hidden');
            else btnBatchDownload.classList.add('hidden');
        }

        function downloadSingle(id) {
            updateExportCanvas(id);
            const data = imagesData.get(id);
            if (!data || !data.currentCanvas) return;

            const formatSelect = document.getElementById(`format-${id}`);
            const qualityInput = document.getElementById(`quality-${id}`);
            const format = formatSelect ? formatSelect.value : 'png';
            const quality = qualityInput ? (parseInt(qualityInput.value, 10) || 92) / 100 : 0.92;
            const suffix = data.settings.unit === 'mm'
                ? `_${data.settings.width}x${data.settings.height}mm`
                : `_${data.settings.width}x${data.settings.height}px`;
            const ext = format === 'jpeg' ? 'jpg' : 'png';
            const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
            const filename = `${data.originalName}${suffix}.${ext}`;

            const link = document.createElement('a');
            link.download = filename;
            link.href = data.currentCanvas.toDataURL(mime, format === 'jpeg' ? quality : 1.0);
            link.click();
        }

        btnBatchDownload.addEventListener('click', async () => {
            if (imagesData.size === 0) return;
            const originalText = btnBatchDownload.innerHTML;
            const total = imagesData.size;
            let done = 0;

            btnBatchDownload.disabled = true;
            batchProgressBar.classList.remove('hidden');
            batchProgressText.classList.remove('hidden');
            batchProgressFill.style.width = '0%';
            batchProgressText.textContent = `0 / ${total}`;

            try {
                const zip = new JSZip();
                const entries = Array.from(imagesData.values());

                for (const data of entries) {
                    updateExportCanvas(data.id);
                    const suffix = data.settings.unit === 'mm'
                        ? `_${data.settings.width}x${data.settings.height}mm`
                        : `_${data.settings.width}x${data.settings.height}px`;
                    const formatSelect = document.getElementById(`format-${data.id}`);
                    const qualityInput = document.getElementById(`quality-${data.id}`);
                    const format = formatSelect ? formatSelect.value : 'png';
                    const quality = qualityInput ? (parseInt(qualityInput.value, 10) || 92) / 100 : 0.92;
                    const ext = format === 'jpeg' ? 'jpg' : 'png';
                    const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
                    const filename = `${data.originalName}${suffix}.${ext}`;

                    await new Promise((resolve) => {
                        data.currentCanvas.toBlob((blob) => {
                            zip.file(filename, blob);
                            done++;
                            const pct = Math.round((done / total) * 100);
                            batchProgressFill.style.width = pct + '%';
                            batchProgressText.textContent = `${done} / ${total}`;
                            btnBatchDownload.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ${done}/${total}`;
                            resolve();
                        }, mime, format === 'jpeg' ? quality : 1.0);
                    });
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' }, (meta) => {
                    // optional finer progress during zip
                    if (meta.percent) {
                        batchProgressText.textContent = `壓縮 ${Math.round(meta.percent)}%`;
                    }
                });
                const url = URL.createObjectURL(zipBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Resized_Images_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.zip`;
                link.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error(err);
                alert('生成壓縮檔時發生錯誤。');
            } finally {
                btnBatchDownload.innerHTML = originalText;
                btnBatchDownload.disabled = false;
                setTimeout(() => {
                    batchProgressBar.classList.add('hidden');
                    batchProgressText.classList.add('hidden');
                    batchProgressFill.style.width = '0%';
                }, 800);
            }
        });

        window.addEventListener('resize', debounce(() => {
            for (const id of imagesData.keys()) {
                layoutCropFrame(id);
                drawStage(id);
                updateExportCanvas(id);
            }
        }, 150));
    </script>
</body>
</html>
